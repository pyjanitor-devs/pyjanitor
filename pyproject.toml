[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyjanitor"
version = "0.32.14"
description = "Tools for cleaning pandas DataFrames"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "pyjanitor devs", email = "ericmajinglong@gmail.com"}
]
maintainers = [
    {name = "pyjanitor devs", email = "ericmajinglong@gmail.com"}
]
keywords = ["pandas", "data-cleaning", "data-science", "janitor"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "natsort>=8.4.0,<9",
    "pandas-flavor>=0.8.1,<0.9",
    "multipledispatch",
    "scipy", "janitor-rs>=0.6.1,<0.7"]

[project.optional-dependencies]
dev = [
    "pip-tools",
    "pre-commit",
    "isort>=4.3.18",
    "black>=19.3b0",
    "darglint",
    "flake8",
]
docs = [
    "mkdocs",
    "polars",
    "mkdocs-material",
    "mkdocstrings>=0.19.0",
    "mkdocstrings-python",
    "ipython>7.31.1",
    "biopython",
    "tqdm",
    "unyt",
    "pyspark",
]
test = [
    "pytest-cov",
    "pytest-xdist",
    "pytest>=3.4.2",
    "hypothesis>=4.4.0",
    "interrogate",
    "pandas-vet",
    "polars",
    "py>=1.10.0",
]
biology = [
    "biopython",
]
chemistry = [
    "tqdm",
]
engineering = [
    "unyt",
]
spark = [
    "pyspark",
]
all = [
    "pip-tools",
    "pre-commit",
    "isort>=4.3.18",
    "black>=19.3b0",
    "darglint",
    "flake8",
    "mkdocs",
    "polars",
    "mkdocs-material",
    "mkdocstrings>=0.19.0",
    "mkdocstrings-python",
    "ipython>7.31.1",
    "biopython",
    "tqdm",
    "unyt",
    "pyspark",
    "pytest-cov",
    "pytest-xdist",
    "pytest>=3.4.2",
    "hypothesis>=4.4.0",
    "interrogate",
    "pandas-vet",
    "py>=1.10.0",
]

[project.urls]
Homepage = "https://github.com/pyjanitor-devs/pyjanitor"
Documentation = "https://pyjanitor-devs.github.io/pyjanitor"
Repository = "https://github.com/pyjanitor-devs/pyjanitor"
"Bug Tracker" = "https://github.com/pyjanitor-devs/pyjanitor/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
namespaces = false

[tool.pixi.workspace]
channels = [
    "https://prefix.dev/conda-forge",
    "https://conda.anaconda.org/conda-forge/label/pandas_rc",
]
platforms = ["osx-arm64", "linux-64", "win-64"]

[tool.pixi.pypi-dependencies]
pyjanitor = { path = ".", editable = true }

[tool.pixi.dependencies]
python = ">=3.10"
pandas = "*"
numpy = "*"
jupyter = ">=1.1.1,<2"
ipython = ">=9.9.0,<10"
ipykernel = ">=7.1.0,<8"
pixi-kernel = ">=0.7.1,<0.8"
jupyterlab = ">=4.5.3,<5"

[tool.pixi.feature.tests.dependencies]
pytest = ">=9.0.2,<10"
pytest-cov = ">=7.0.0,<8"
pytest-xdist = ">=3.8.0,<4"
hypothesis = ">=6.151.2,<7"
interrogate = ">=1.7.0,<2"
pandas-vet = ">=2023.8.2,<2024"
polars = ">=1.37.1,<2"
py = ">=1.11.0,<2"
unyt = ">=3.1.0,<4"
matplotlib = ">=3.10.8,<4"
openpyxl = ">=3.1.5,<4"
rdkit = ">=2025.9.4,<2026"
requests = ">=2.32.5,<3"
numba = ">=0.63.1,<0.64"
pyspark = ">=4.1.1,<5"

[tool.pixi.feature.docs.dependencies]
mkdocs = ">=1.6.1,<2"
mkdocs-material = ">=9.7.1,<10"
mkdocstrings = ">=1.0.2,<2"
mkdocstrings-python = ">=2.0.1,<3"
mknotebooks = ">=0.8.0,<0.9"
ipython = ">=9.9.0,<10"

[tool.pixi.feature.biology.dependencies]
biopython = ">=1.86,<2"

[tool.pixi.feature.chemistry.dependencies]
tqdm = ">=4.67.1,<5"

[tool.pixi.feature.engineering.dependencies]
unyt = ">=3.1.0,<4"

[tool.pixi.feature.spark.dependencies]
pyspark = ">=4.1.1,<5"

[tool.pixi.feature.py311.dependencies]
python = "3.11.*"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"
pandas = ">=3.0.0"

[tool.pixi.tasks]
start = "pre-commit install"
format = "pre-commit run ruff-format --all-files"
test = "pytest -v -n auto --color=yes"
lint = "pre-commit run --all-files"
docs = "mkdocs build"
serve-docs = "mkdocs serve"
isort = "isort --check-only --use-parentheses --trailing-comma --multi-line 3 --line-length 79 ."
check = { cmd = "pytest -v -n auto --color=yes && mkdocs build && isort --check-only --use-parentheses --trailing-comma --multi-line 3 --line-length 79 . && pre-commit run ruff-format --all-files && pre-commit run --all-files", "depends-on" = [] }
style = { cmd = "isort --check-only --use-parentheses --trailing-comma --multi-line 3 --line-length 79 . && pre-commit run ruff-format --all-files", "depends-on" = [] }
release = "python -m build"

[tool.pixi.feature.tests.tasks]
test = "pytest -v -n auto --color=yes"

[tool.pixi.feature.docs.tasks]
build-docs = "mkdocs build"
serve-docs = "mkdocs serve"

[tool.pixi.feature.setup.tasks]
setup = "pre-commit autoupdate && pre-commit install --install-hooks"
update = "pre-commit autoupdate"

[tool.pixi.environments]
default = { features = ["tests", "setup"] }
docs = { features = ["docs"] }
tests = { features = ["tests", "setup"] }
biology = { features = ["tests", "setup", "biology"] }
chemistry = { features = ["tests", "setup", "chemistry"] }
engineering = { features = ["tests", "setup", "engineering"] }
spark = { features = ["tests", "setup", "spark"] }
py311 = { features = ["tests", "setup", "py311"] }
py312 = { features = ["tests", "setup", "py312"] }
py313 = { features = ["tests", "setup", "py313"] }

[tool.coverage.run]
omit = [
    "tests/*",
]

[tool.black]
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | env
  | venv
)/
'''
include = '\.pyi?$'
line-length = 79
target-version = ['py38', 'py39', 'py310']

[tool.interrogate]
exclude = ["docs"]
fail-under = 55
ignore-init-method = true
ignore-init-module = true
ignore-module = false
ignore-private = false
ignore-semiprivate = false
quiet = false
verbose = 2

# https://docs.pytest.org/en/6.2.x/mark.html#registering-marks
[tool.pytest.ini_options]
markers = [
    "functions: test for general functions",
    "biology: tests for biology",
    "chemistry: tests for chemistry",
    "finance: tests for finance",
    "utils: utility tests",
    "engineering: tests for engineering",
    "ml: tests for machine learning",
    "polars: tests for polars methods",
    "spark_functions: tests for pyspark functions",
    "xarray: tests for xarray functions",
    "timeseries: tests for timeseries",
    "documentation: tests for documentation",
    "turtle: tests that take more than 5 seconds to execute",
]
# Normalize whitespace in all doctests to handle pandas output formatting differences
doctest_optionflags = "NORMALIZE_WHITESPACE"


[tool.ruff]
indent-width = 4
line-length = 88
output-format = "grouped"
respect-gitignore = true
extend-exclude = [
    "doc/",
]
show-fixes = true
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]


# Assume Python 3.8 (minimum supported)
target-version = "py38"

[tool.ruff.format]
indent-style = "space"
line-ending = "lf"
quote-style = "double"
docstring-code-format = true

[tool.ruff.lint]
external = ['DOC']
# Enable pycodestyle (`E`) and Pyflakes (`F`) codes by default.
select = ["E", "F", "I"]
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["A", "B", "C", "D", "E", "F", "G", "I", "N", "Q", "S", "T", "W", "ANN", "ARG", "BLE", "COM", "DJ", "DTZ", "EM", "ERA", "EXE", "FBT", "ICN", "INP", "ISC", "NPY", "PD", "PGH", "PIE", "PL", "PT", "PTH", "PYI", "RET", "RSE", "RUF", "SIM", "SLF", "TCH", "TID", "TRY", "UP", "YTT"]
unfixable = []

[tool.ruff.lint.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10


[tool.ruff.lint.per-file-ignores]
# ignore unused imports in __init__.py files
"__init__.py" = ["F401"]
# Ignore missing type annotations in tests
"test_*.py" = ["ANN"]

[tool.ruff.lint.flake8-annotations]
# suppress ANN401 for *args and **kwargs
allow-star-arg-any = true

[tool.ruff.lint.pydocstyle]
# https://github.com/google/styleguide/blob/gh-pages/pyguide.md#38-comments-and-docstrings
convention = "google"
